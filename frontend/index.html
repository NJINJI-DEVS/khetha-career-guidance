<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#005A36" />
    <meta name="description" content="Career guidance for South African learners: subject choice, APS, qualifications, providers and mentors. Works offline." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- iOS has no manifest install prompt; these are what it reads instead -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Khetha" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Khetha Career Guidance — NCAP</title>

    <!--
      Theme is resolved before the first paint, synchronously, so a learner who
      uses dark mode never sees a white flash while the bundle loads. Inline and
      blocking on purpose: moving it into main.jsx is what causes the flash.
    -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('khetha.theme');
          if (m !== 'light' && m !== 'dark') m = 'system';
          var dark = m === 'dark' ||
            (m === 'system' && window.matchMedia &&
             window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          if (dark) {
            var t = document.querySelector('meta[name="theme-color"]');
            if (t) t.setAttribute('content', '#0B1220');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
