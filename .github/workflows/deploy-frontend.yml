name: Deploy frontend to cPanel

# Runs whenever frontend code lands on main, or manually via the Actions tab.
# Builds the Vite/PWA production bundle and FTP-deploys frontend/dist to the
# cPanel document root for khetha.njinjicom.africa.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Deploy to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./frontend/dist/
          server-dir: ${{ secrets.CPANEL_FTP_TARGET_DIR }}
          # Left off deliberately. This mirrors local-dir onto server-dir and
          # DELETES anything on the server that isn't in local-dir — correct
          # long-term (Vite content-hashes every JS/CSS filename per build,
          # so old chunks would otherwise accumulate forever), but a wrong
          # CPANEL_FTP_TARGET_DIR secret combined with this would delete
          # whatever's actually at that path. Flip to true once you've
          # confirmed a normal (non-destructive) deploy lands in the right
          # place.
          dangerous-clean-slate: false
